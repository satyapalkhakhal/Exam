# deploy/nginx/exam.conf — server blocks for the exam app (one origin: static web + /api proxy).
# Install as /etc/nginx/conf.d/exam.conf, edit server_name/cert paths, then `nginx -t && systemctl reload nginx`.
# For UAT, use the uat domain/paths and proxy_pass to 127.0.0.1:4101 (API_HOST_PORT).
# limit_req_zone must live in the http context, which conf.d files are included into.

# Generous on purpose: a campus NAT puts many candidates behind one IP; the app's Redis limiters are the real guard.
limit_req_zone $binary_remote_addr zone=exam_candidate_auth:10m rate=50r/s;

server {
    listen 80;
    server_name exam.arihantcapital.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name exam.arihantcapital.com;

    ssl_certificate     /etc/nginx/ssl/exam.crt;
    ssl_certificate_key /etc/nginx/ssl/exam.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # The CRM hit the 4 KB default on UAT.
    large_client_header_buffers 4 16k;
    # CSV/XLSX uploads.
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'" always;

    root /var/www/exam.arihantcapital.com;
    index index.html;

    location /api/candidate/auth/ {
        limit_req zone=exam_candidate_auth burst=200 nodelay;
        limit_req_status 429;
        # UAT server block: point this at 127.0.0.1:4101.
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # UAT server block: point this at 127.0.0.1:4101.
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
