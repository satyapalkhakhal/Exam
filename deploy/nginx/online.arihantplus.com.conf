# Recruitment Exam - online.arihantplus.com (production)
# Same layout as the other Arihant nginx sites (certs in /etc/nginx/certs/<domain>/, shared includes).
# Install:  sudo cp deploy/nginx/online.arihantplus.com.conf /etc/nginx/conf.d/online.arihantplus.com.conf
#           sudo nginx -t && sudo systemctl reload nginx
#
# The web app is static files in /var/www/online.arihantplus.com (deploy/deploy-web.sh production).
# The API container listens on 127.0.0.1:4100 (API_HOST_PORT in apps/api/.env.production).
# If you change API_HOST_PORT, change both proxy_pass lines.
# PUBLIC_WEB_URL, CORS_ORIGIN and EXAM_WEB_DOMAIN in that env file must name this same domain.

# Outer rate limit on candidate login (must be outside the server block).
# Generous on purpose: a campus NAT puts many candidates behind one IP; the app's Redis limits are the real guard.
limit_req_zone $binary_remote_addr zone=exam_candidate_auth:10m rate=50r/s;

server {
    listen 443 ssl;
    server_name online.arihantplus.com;

    # Must be a certificate valid for online.arihantplus.com (e.g. the *.arihantplus.com wildcard).
    ssl_certificate     /etc/nginx/certs/arihantplus.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/arihantplus.com/privatekey.key;
    include /etc/nginx/conf.d/_ssl_params.conf;

    # Large auth cookies; CSV/XLSX uploads (the app accepts up to 5 MB)
    large_client_header_buffers 4 16k;
    client_max_body_size 6m;

    # Location capture at login needs geolocation allowed for this site
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    root /var/www/online.arihantplus.com;
    index index.html;

    location = /50x.html {
        root  /usr/share/nginx/html;
        internal;
    }

    # Candidate login (send / verify code, mobile registration): extra per-IP limit
    # The API logs candidate IPs, so these forwarding headers are set explicitly.
    location /api/candidate/auth/ {
        limit_req zone=exam_candidate_auth burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api: admin panel API, exam autosave, uploads
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change under the same name: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the page shell, so a redeploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Candidate pages (/login, /register, /dashboard, /exam) and admin (/admin/...)
    location / {
        try_files $uri /index.html;
    }
}

# Redirect plain HTTP to HTTPS (skip this block if the server already has a global port-80 redirect)
server {
    listen 80;
    server_name online.arihantplus.com;
    return 301 https://$host$request_uri;
}
