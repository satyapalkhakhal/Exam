# deploy/docker-compose.prod.yml
#
# exam_postgres + exam_redis + exam_api on the private exam_net network. Only
# the API is published, and only on 127.0.0.1:4100 (nginx proxies to it).
# Always run with the env file, so ${...} below resolve:
#   EXAM_ENV=production docker compose -p exam_production --env-file apps/api/.env.production -f deploy/docker-compose.prod.yml ...
# deploy-api.sh does this for you. Manual runs need EXAM_ENV=<uat|production> exported
# and `-p exam_<env>`. Container, network and volume names carry the env suffix so UAT
# and production can share a host; API_HOST_PORT (env file) sets the loopback port.

services:
  exam_postgres:
    image: postgres:16-alpine
    container_name: exam_postgres_${EXAM_ENV:?set EXAM_ENV}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-exam_db}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - exam_pgdata:/var/lib/postgresql/data
    networks: [exam_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  exam_redis:
    image: redis:7-alpine
    container_name: exam_redis_${EXAM_ENV}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - exam_redisdata:/data
    networks: [exam_net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  exam_api:
    image: ${EXAM_API_IMAGE:-exam-api:latest}
    container_name: exam_api_${EXAM_ENV}
    restart: unless-stopped
    env_file:
      - ${EXAM_ENV_FILE:-../apps/api/.env.production}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4100}:4100"
    depends_on:
      exam_postgres:
        condition: service_healthy
      exam_redis:
        condition: service_healthy
    networks: [exam_net]

networks:
  exam_net:
    name: exam_net_${EXAM_ENV}

volumes:
  exam_pgdata:
    name: exam_pgdata_${EXAM_ENV}
  exam_redisdata:
    name: exam_redisdata_${EXAM_ENV}
